<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- 填：页面标题 --></title>
<!-- ⚠️ 老样板（260824 从 Feynman v2.html 拼的）：缺页内搜索／稳定锚／缩放胶囊，只作参考。出页走 SKILL.md 路线 A（md → 生成器），🚫 别 cp 本文件手写 -->
<!-- 模板 · 结构输出标准 v1 · 判据见 结构输出标准.md · 样板 ~/Code/html集合/html-Feynman/课件/为什么是1v1/v2.html
     🔴 复制本文件改名后用；本文件本身别当产物改 -->
<style>
:root{ --acc:#0f766e; --acc-d:#115e59; --acc-bg:#ecfbf8; --ink:#23262e; --ink-soft:#3d424d;
  --muted:#6b7180; --line:#e2e0d6; --bg:#faf9f4; --surface:#fffefa; --card:#ffffff;
  --warn:#b45309; --warn-bg:#fff7ed; --bad:#c2410c; --ok:#15803d; --ok-bg:#f0fdf4;
  --why:#b45309; --what:#0f766e; --how:#7c3aed; --good:#be185d; --bar:64px; }
*{ box-sizing:border-box; } html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body{ margin:0; padding:0 0 80px; font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); line-height:1.78; -webkit-font-smoothing:antialiased; }

.hero{ background:var(--surface); border-bottom:1px solid var(--line); text-align:center; padding:40px 22px 26px; }
.hero .eyebrow{ display:inline-block; font-size:11.5px; letter-spacing:.5px; color:var(--acc-d); font-weight:700; margin-bottom:11px; }
.hero h1{ margin:0 auto 9px; font-size:26px; font-weight:800; }
.hero .lead{ margin:0 auto; max-width:40em; font-size:14.5px; color:var(--ink-soft); }
.hero a{ color:var(--muted); font-size:13px; text-decoration:none; }
.hero a:hover{ color:var(--acc); }

.bar{ position:sticky; top:0; z-index:50; background:rgba(255,254,250,.94); backdrop-filter:saturate(180%) blur(10px); border-bottom:1px solid var(--line); }
.bar .in{ max-width:780px; margin:0 auto; padding:8px 22px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.bar button{ font:600 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; color:var(--acc-d); background:var(--card); border:1px solid var(--line); border-radius:20px; padding:8px 15px; min-height:44px; cursor:pointer; transition:.15s; }
.bar button:hover{ background:var(--acc-bg); border-color:var(--acc); }
.bar button.pri{ background:var(--acc); color:#fff; border-color:var(--acc); }
.bar button.pri:hover{ background:var(--acc-d); }
.bar .pos{ margin-left:auto; font-size:12.5px; color:var(--muted); font-weight:600; white-space:nowrap; }
.bar .pos b{ color:var(--acc-d); font-size:14px; }
.bar .hint{ font-size:11.5px; color:var(--muted); }

main{ max-width:780px; margin:0 auto; padding:22px 22px 0; }
p{ font-size:14.5px; color:var(--ink-soft); margin:10px 0; }
strong{ color:var(--ink); }
sup{ font-size:10.5px; color:var(--acc); font-weight:700; }
sup a{ color:inherit; text-decoration:none; display:inline-block; padding:2px 3px; }
ul,ol{ font-size:14.5px; color:var(--ink-soft); padding-left:22px; }
li{ margin:6px 0; }

details.sec{ background:var(--card); border:1px solid var(--line); border-radius:13px; margin:0 0 11px; overflow:hidden; scroll-margin-top:calc(var(--bar) + 14px); box-shadow:0 1px 3px rgba(0,0,0,.05); }
details.sec > summary{ cursor:pointer; list-style:none; padding:15px 20px; display:flex; align-items:center; gap:11px; flex-wrap:wrap; min-height:52px; }
details.sec > summary::-webkit-details-marker{ display:none; }
details.sec > summary::after{ content:"＋"; margin-left:auto; color:var(--muted); font-weight:700; font-size:16px; flex:none; }
details.sec[open] > summary::after{ content:"－"; }
details.sec[open] > summary{ border-bottom:1px solid var(--line); background:#fbfaf6; }
details.sec > summary .num{ flex:none; width:24px; height:24px; border-radius:7px; background:var(--acc-bg); color:var(--acc-d); font-size:12px; font-weight:800; display:grid; place-items:center; }
details.sec > summary .ti{ font-size:16px; font-weight:800; color:var(--ink); }
details.sec > summary .sub{ font-size:12.5px; color:var(--muted); font-weight:500; }
details.sec > .body{ padding:6px 20px 16px; }
details.sec.cur{ border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-bg); }
details.sec > summary .tag{ flex:none; font-size:10.5px; font-weight:800; letter-spacing:1.5px; color:#fff; border-radius:5px; padding:2px 8px; }
.tag.why{ background:var(--why); } .tag.what{ background:var(--what); }
.tag.how{ background:var(--how); } .tag.good{ background:var(--good); }

details.sub{ background:var(--surface); border:1px solid var(--line); border-radius:11px; margin:0 0 9px; overflow:hidden; scroll-margin-top:calc(var(--bar) + 14px); }
details.sub > summary{ cursor:pointer; list-style:none; padding:12px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-height:48px; }
details.sub > summary::-webkit-details-marker{ display:none; }
details.sub > summary::after{ content:"＋"; margin-left:auto; color:var(--muted); font-weight:700; flex:none; }
details.sub[open] > summary::after{ content:"－"; }
details.sub[open] > summary{ border-bottom:1px solid var(--line); }
details.sub > .body{ padding:12px 16px 4px; }
details.sub .no{ flex:none; font-size:12px; font-weight:800; color:#fff; background:var(--acc); border-radius:5px; padding:2px 8px; }
details.sub .nm{ font-size:15.5px; font-weight:800; color:var(--ink); }
details.sub .en{ font-size:11.5px; color:var(--muted); font-weight:600; }
details.sub.warnsub{ border-left:4px solid var(--warn); } details.sub.warnsub .no{ background:var(--warn); }
details.sub.road{ border-left:4px solid var(--what); } details.sub.road .no{ background:var(--what); }
details.sub.road.rb{ border-left-color:#0891b2; } details.sub.road.rb .no{ background:#0891b2; }

.three{ counter-reset:t; margin:0; padding:0; list-style:none; }
.three li{ counter-increment:t; position:relative; padding:0 0 14px 40px; margin:0; font-size:15.5px; font-weight:700; color:var(--ink); line-height:1.72; }
.three li:last-child{ padding-bottom:2px; }
.three li::before{ content:counter(t); position:absolute; left:0; top:3px; width:25px; height:25px; border-radius:50%; background:var(--acc); color:#fff; font-size:12.5px; font-weight:800; display:grid; place-items:center; }
.three li em{ font-style:normal; font-weight:500; font-size:13.3px; color:var(--ink-soft); display:block; line-height:1.76; margin-top:3px; }

.lead2{ font-size:15px; font-weight:700; color:var(--ink); margin:4px 0 16px; line-height:1.7; }
.scene{ border:1px solid var(--line); border-radius:12px; padding:0; margin:0 0 13px; overflow:hidden; background:var(--surface); }
.scene .sh{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; padding:12px 17px; background:#fbfaf6; border-bottom:1px solid var(--line); }
.scene .sh .ic{ font-size:16px; }
.scene .sh .tt{ font-size:15.5px; font-weight:800; color:var(--ink); }
.scene .sh .rl{ font-size:12px; font-weight:700; color:#fff; background:var(--muted); border-radius:5px; padding:2px 8px; }
.scene .bd{ padding:13px 17px 15px; }
.scene .pt:last-child{ margin-bottom:0; }
.scene.teach{ border-left:4px solid var(--muted); }
.scene.self{ border-left:4px solid var(--acc); }
.scene.self .sh{ background:var(--acc-bg); }
.scene.self .sh .rl{ background:var(--acc); }
.scene.self .pt{ border-left-color:var(--acc); }

.ring{ display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); margin:14px 0 6px; }
.ring button{ display:block; text-align:left; font-family:inherit; cursor:pointer; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 15px; transition:.15s; width:100%; min-width:0; }
.ring button:hover{ transform:translateY(-2px); box-shadow:0 4px 14px rgba(0,0,0,.06); }
.ring .k{ font-size:10.5px; font-weight:800; letter-spacing:1.5px; }
.ring .t{ font-size:14.5px; font-weight:800; color:var(--ink); margin:3px 0 3px; }
.ring .d{ font-size:12px; color:var(--muted); line-height:1.55; }
.ring .w1{ border-top:3px solid var(--why); } .ring .w1 .k{ color:var(--why); }
.ring .w2{ border-top:3px solid var(--how); } .ring .w2 .k{ color:var(--how); }
.ring .w3{ border-top:3px solid var(--what); } .ring .w3 .k{ color:var(--what); }
.ring .w4{ border-top:3px solid var(--good); } .ring .w4 .k{ color:var(--good); }
.ringnote{ font-size:12.3px; color:var(--muted); text-align:center; margin:0 0 16px; line-height:1.7; }

.box{ background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:15px 18px; margin:13px 0; box-shadow:0 1px 3px rgba(0,0,0,.04); }
.box.warn{ background:var(--warn-bg); border-color:#fed7aa; }
.box.ok{ background:var(--ok-bg); border-color:#bbf7d0; }
.box h4{ margin:0 0 6px; font-size:14.5px; }
.box.warn h4{ color:var(--bad); } .box.ok h4{ color:var(--ok); }
.box p:last-child{ margin-bottom:0; }

.ruler{ background:var(--card); border:1px solid var(--line); border-left:4px solid var(--acc);
  border-radius:12px; padding:16px 18px 12px; margin:14px 0; }
.ruler .rh{ font-size:13.5px; font-weight:800; color:var(--acc-d); margin:0 0 4px; }
.ruler .rs{ font-size:12.3px; color:var(--muted); margin:0 0 10px; line-height:1.7; }
.ruler svg{ max-width:100%; height:auto; display:block; margin:0 auto; }
.ruler .cap{ font-size:12.5px; color:var(--muted); margin-top:10px; line-height:1.75; }
.svgalt{ display:none; }
.svgalt .row{ border:1px solid var(--line); border-radius:9px; padding:10px 13px; margin:0 0 9px; font-size:14px; line-height:1.7; }
.svgalt .row.a1{ border-left:4px solid var(--muted); color:var(--ink-soft); }
.svgalt .row.a2{ border-left:4px solid var(--acc); color:var(--acc-d); background:var(--acc-bg); }

.pt{ margin:0 0 12px; padding-left:15px; border-left:2px solid var(--acc-bg); }
.pt:last-child{ margin-bottom:2px; }
.q{ font-size:14.2px; font-weight:800; color:var(--ink); line-height:1.68; }
.a{ font-size:13.3px; color:var(--ink-soft); line-height:1.76; margin:3px 0 0; }
.pt.hit{ border-left-color:var(--good); }
.enum{ margin:6px 0 0; padding:0; list-style:none; }
.enum li{ font-size:13.3px; color:var(--ink-soft); line-height:1.72; margin:0 0 5px; padding-left:24px; text-indent:-24px; }
.enum li b{ color:var(--acc-d); font-weight:800; margin-right:5px; }

.punch{ background:var(--card); border:2px solid var(--acc); border-radius:13px; padding:20px 22px; margin:16px 0; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.04); }
.punch .p1{ font-size:20px; font-weight:800; color:var(--acc-d); line-height:1.6; }
.punch .p2{ font-size:13px; color:var(--muted); margin-top:8px; line-height:1.7; }
.vs{ display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); margin:12px 0; }
.vs .col{ border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:13px 16px; }
.vs .col.neg{ border-top:3px solid var(--bad); }
.vs .col.pos{ border-top:3px solid var(--ok); }
.vs .col .ch{ font-size:13.5px; font-weight:800; margin:0 0 6px; }
.vs .col.neg .ch{ color:var(--bad); } .vs .col.pos .ch{ color:var(--ok); }
.vs .col .cn{ font-size:12.8px; color:var(--ink-soft); line-height:1.7; }
.vs .col .cn b{ color:var(--ink); }
.path{ counter-reset:pp; margin:6px 0 0; padding:0; list-style:none; }
.path li{ counter-increment:pp; position:relative; padding:0 0 20px 46px; margin:0; }
.path li:last-child{ padding-bottom:4px; }
.path li::before{ content:"步" counter(pp); position:absolute; left:0; top:2px; width:34px; height:22px; border-radius:11px;
  background:var(--good); color:#fff; font-size:11.5px; font-weight:800; display:grid; place-items:center; letter-spacing:.5px; }
.path .pq{ font-size:15px; font-weight:800; color:var(--ink); line-height:1.65; }
.path .a{ padding-left:14px; border-left:2px solid var(--acc-bg); margin:5px 0 0; }
.guard{ background:var(--ok-bg); border:1px solid #bbf7d0; border-left:4px solid var(--ok); border-radius:10px; padding:12px 15px; margin:12px 0 2px; }
.guard .gh2{ font-size:11px; font-weight:800; letter-spacing:1.5px; color:var(--ok); margin-bottom:4px; }
.guard .gq{ font-size:15px; font-weight:800; color:var(--ink); line-height:1.6; }
.guard .ga{ font-size:12.8px; color:var(--ink-soft); line-height:1.72; margin-top:5px; }
.meas{ background:var(--acc-bg); border:1px solid #bfe3dd; border-left:4px solid var(--acc); border-radius:9px; padding:12px 15px; margin:14px 0 0; }
.meas .m1{ font-size:14.5px; font-weight:800; color:var(--acc-d); line-height:1.75; }
.note{ font-size:12.3px; color:var(--muted); line-height:1.75; margin:9px 0; padding:8px 12px; background:var(--bg); border-radius:8px; }
.tpl{ background:#2b2f37; color:#e8e8ea; border-radius:10px; padding:13px 16px; margin:12px 0; font:14px/2 ui-monospace,SFMono-Regular,Menlo,monospace; overflow-x:auto; white-space:pre-wrap; }
.tpl .lb2{ display:block; font:700 11px/1.4 -apple-system,"PingFang SC",sans-serif; color:#9aa3af; margin-bottom:7px; letter-spacing:1px; }

ol.refs{ font-size:13px; color:var(--ink-soft); padding-left:0; list-style:none; counter-reset:r; }
ol.refs li{ counter-increment:r; position:relative; padding:10px 0 10px 42px; border-bottom:1px dashed var(--line); margin:0; }
ol.refs .q{ font-size:13.6px; line-height:1.6; }
ol.refs .a{ font-size:12.6px; color:var(--muted); }
ol.refs li::before{ content:"[" counter(r) "]"; position:absolute; left:0; top:9px; font-weight:800; color:var(--acc); font-size:12.5px; }
ol.refs a{ color:var(--acc-d); overflow-wrap:anywhere; }
ol.refs .kind{ display:inline-block; font-size:11px; font-weight:700; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 6px; margin-right:7px; }

.appendix{ max-width:780px; margin:26px auto 0; padding:0 22px; }
.appendix .box{ border-top:3px solid var(--line); }
footer{ text-align:center; padding:24px; color:var(--muted); font-size:12px; border-top:1px solid var(--line); margin-top:36px; line-height:1.9; }

@media(max-width:560px){
  .bar .hint, #collapse, #expand{ display:none; }
  main, .appendix{ padding-left:16px; padding-right:16px; }
  p, ul, ol{ font-size:16px; }
  .a, .enum li{ font-size:14.5px; }
  .q{ font-size:15.5px; }
  .three li{ font-size:16px; } .three li em{ font-size:14px; }
  .vs{ grid-template-columns:1fr; }
  .ring{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  details.sec > summary .sub{ display:none; }
  .svgwrap{ display:none; } .svgalt{ display:block; }
}
@media print{ .bar{ display:none; } details{ break-inside:avoid; } details>.body{ display:block !important; } }

</style>
</head>
<body>

<div class="hero">
  <span class="eyebrow"><!-- 填：眉标，如 OPC · 课件 --></span>
  <h1><!-- 填：标题 --></h1>
  <p class="lead"><!-- 填：一句话说这页要解决什么 --></p>
</div>

<!-- ④ sticky 工具条 —— 🔴 四个 id 别改（next/prev/expand/collapse/cur/tot 脚本要用） -->
<div class="bar">
  <div class="in">
    <button type="button" id="prev">上一段</button>
    <button type="button" id="next" class="pri">下一段</button>
    <button type="button" id="expand">全展开</button>
    <button type="button" id="collapse">全收起</button>
    <span class="hint">← → 键可翻 · 展开后翻页不再收起</span>
    <span class="pos">第 <b id="cur">–</b> / <span id="tot">–</span> 段</span>
  </div>
</div>

<main>

<!-- ① 第 1 段固定 TL;DR：三句话，🚫 别写五条 -->
<details class="sec" id="s1">
  <summary><span class="num">1</span><span class="ti">🎯 先看三句话</span><span class="sub">整页就讲这一件事</span></summary>
  <div class="body">
    <ol class="three">
      <li><!-- 填：结论一 --><em><!-- 填：凭什么／在哪展开 --></em></li>
      <li><!-- 填：结论二 --><em><!-- 填 --></em></li>
      <li><!-- 填：结论三 --><em><!-- 填 --></em></li>
    </ol>
  </div>
</details>

<!-- ② 黄金圈导航 —— 🔴 四档必须齐：WHY → HOW → WHAT → HOW GOOD -->
<div class="ring">
  <button type="button" class="w1" data-go="s2"><div class="k">WHY · 第 2 段</div><div class="t"><!-- 填 --></div><div class="d"><!-- 填：一句钩子 --></div></button>
  <button type="button" class="w2" data-go="s3"><div class="k">HOW · 第 3 段</div><div class="t"><!-- 填 --></div><div class="d"><!-- 填 --></div></button>
  <button type="button" class="w3" data-go="s4"><div class="k">WHAT · 第 4 段</div><div class="t"><!-- 填 --></div><div class="d"><!-- 填 --></div></button>
  <button type="button" class="w4" data-go="s5"><div class="k">HOW GOOD · 第 5 段</div><div class="t"><!-- 填 --></div><div class="d"><!-- 填 --></div></button>
</div>
<p class="ringnote"><!-- 填：这一页从里往外讲：先「为什么」，再「凭什么」，最后才是「怎么做」。 --></p>

<!-- ③ 各段 —— id 连续 · num/tag/ti/sub 四样都要 · body 第一句是 lead2 结论 -->
<details class="sec" id="s2">
  <summary><span class="num">2</span><span class="tag why">WHY</span><span class="ti"><!-- 填 --></span><span class="sub"><!-- 填 --></span></summary>
  <div class="body">
    <p class="lead2">先给结论：<strong><!-- 填：这一段的答案，🚫 别先铺垫 --></strong></p>
    <!-- 正文。引用写成 <sup><a href="#r1">[1]</a></sup> -->
  </div>
</details>

<details class="sec" id="s3">
  <summary><span class="num">3</span><span class="tag how">HOW</span><span class="ti"><!-- 填 --></span><span class="sub"><!-- 填 --></span></summary>
  <div class="body">
    <p class="lead2">先给结论：<strong><!-- 填 --></strong></p>
    <!-- 二级折叠示例 -->
    <details class="sub">
      <summary><span class="no">1</span><span class="nm"><!-- 填 --></span><span class="en"><!-- 填：英文/原文，可省 --></span></summary>
      <div class="body"><p><!-- 填 --></p></div>
    </details>
  </div>
</details>

<details class="sec" id="s4">
  <summary><span class="num">4</span><span class="tag what">WHAT</span><span class="ti"><!-- 填 --></span><span class="sub"><!-- 填 --></span></summary>
  <div class="body">
    <p class="lead2">先给结论：<strong><!-- 填 --></strong></p>
  </div>
</details>

<details class="sec" id="s5">
  <summary><span class="num">5</span><span class="tag good">HOW GOOD</span><span class="ti"><!-- 填 --></span><span class="sub"><!-- 填：怎么算做到了 --></span></summary>
  <div class="body">
    <p class="lead2">先给结论：<strong><!-- 填：验收标准 ＋ 今晚就能做的最小一步 --></strong></p>
  </div>
</details>

<!-- ⑤ 末段固定：对照读物 -->
<details class="sec" id="s6">
  <summary><span class="num">6</span><span class="ti">📎 对照读物 · 不是作业</span><span class="sub">给延伸，不给负担</span></summary>
  <div class="body">
    <ol>
      <li id="r1"><!-- 填：来源 --></li>
    </ol>
  </div>
</details>

</main>

<script>
(function(){
  var steps = Array.prototype.slice.call(document.querySelectorAll('details.sec'));
  var idx = -1, readMode = false;
  var curEl = document.getElementById('cur'), totEl = document.getElementById('tot');
  totEl.textContent = steps.length;

  function mark(){
    steps.forEach(function(d){ d.classList.remove('cur'); });
    if(idx >= 0 && steps[idx] && steps[idx].open) steps[idx].classList.add('cur');
    curEl.textContent = idx >= 0 ? (idx + 1) : '–';
  }
  function goto(i, scroll){
    if(i < 0 || i >= steps.length) return;
    idx = i;
    var target = steps[i];
    if(readMode){ target.open = true; }
    else{ steps.forEach(function(d){ d.open = (d === target); }); }
    mark();
    if(history.replaceState) history.replaceState(null, '', '#' + target.id);
    if(scroll !== false) target.scrollIntoView({behavior:'smooth', block:'start'});
  }
  document.getElementById('next').addEventListener('click', function(){ goto(idx + 1); });
  document.getElementById('prev').addEventListener('click', function(){ goto(idx - 1); });
  document.getElementById('collapse').addEventListener('click', function(){
    readMode = false;
    steps.forEach(function(d){ d.open = false; });
    idx = -1; mark();
    if(steps[0]) steps[0].scrollIntoView({behavior:'smooth', block:'start'});
  });
  document.getElementById('expand').addEventListener('click', function(){
    readMode = true;
    steps.forEach(function(d){ d.open = true; }); mark();
  });
  document.querySelectorAll('.ring button').forEach(function(b){
    b.addEventListener('click', function(){
      var i = steps.indexOf(document.getElementById(b.dataset.go));
      if(i !== -1) goto(i);
    });
  });
  steps.forEach(function(d, i){
    d.addEventListener('toggle', function(){
      if(d.open){ idx = i; }
      mark();
    });
  });
  document.addEventListener('keydown', function(e){
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    if(e.key === 'ArrowRight'){ e.preventDefault(); goto(idx + 1); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); goto(idx - 1); }
  });
  var h = location.hash.replace('#','');
  var hi = h ? steps.indexOf(document.getElementById(h)) : -1;
  if(hi !== -1) goto(hi, true); else goto(0, false);
})();

</script>
</body>
</html>
